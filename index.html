<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Word Sprint</title>
<meta name="description" content="4択クイズで英単語を高速に周回するアプリ">
<meta name="theme-color" content="#4f46e5">
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#16181d;--muted:#6b7280;--line:#e5e7eb;--accent:#4f46e5;--accent-2:#eef2ff;--ok:#16a34a;--ok-bg:#dcfce7;--ng:#dc2626;--ng-bg:#fee2e2;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b22;--text:#e8eaf0;--muted:#9aa1ad;--line:#2a2f3a;--accent:#818cf8;--accent-2:#23264a;--ok:#4ade80;--ok-bg:#12321f;--ng:#f87171;--ng-bg:#3a1717;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.hero{padding:16px 4px 12px}
.hero h1{margin:0;font-size:28px;letter-spacing:-.02em}
.hero h1 span{color:var(--accent)}
.hero p{margin:4px 0 0;font-size:14px}
.muted{color:var(--muted)}
h2{font-size:18px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;padding:7px 0;flex-wrap:wrap}
.row>label{font-size:14px;color:var(--muted);font-weight:600}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--text);font:inherit;font-size:14px;padding:7px 11px;border-radius:7px;cursor:pointer;touch-action:manipulation}
.seg button.on{background:var(--card);color:var(--accent);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.btn{font:inherit;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:11px 16px;cursor:pointer;font-weight:600;touch-action:manipulation}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.big{width:100%;margin-top:12px;padding:15px;font-size:17px}
.btn.ghost{background:transparent;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);text-align:center;margin:10px 0 0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.tiles b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.tiles small{color:var(--muted);font-size:12px}
.links{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sec-title{margin:4px 4px 8px;font-size:14px;font-weight:700;color:var(--muted)}
.decks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:560px){.decks{grid-template-columns:repeat(3,1fr)}}
.deck{position:relative;text-align:left;font:inherit;color:var(--text);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 12px 10px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:104px;touch-action:manipulation;transition:border-color .12s,box-shadow .12s}
.deck.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-2)}
.deck .dn{font-weight:700;font-size:15px;padding-right:24px}
.deck .dd{font-size:12px;color:var(--muted);line-height:1.4;flex:1}
.deck .dm{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.deck .bar{height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.deck .bar>i{display:block;height:100%;background:var(--accent)}
.deck .edit{position:absolute;top:6px;right:6px;border:0;background:transparent;color:var(--muted);font-size:15px;padding:4px 6px;cursor:pointer}
.deck.new{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);font-weight:600}
.deck.off{opacity:.55}
input[type=text]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-bottom:6px}
/* quiz */
.qtop{display:flex;align-items:center;gap:12px;padding:4px 0 12px}
.icon{border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;padding:4px 8px;line-height:1}
.progress{flex:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress>div{height:100%;background:var(--accent);width:0;transition:width .25s}
#counter{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);height:20px;margin-bottom:6px}
.qcard{position:relative;text-align:center;padding:28px 16px 26px;min-height:170px;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;transition:border-color .15s,background .15s}
.qcard.ok{border-color:var(--ok);background:var(--ok-bg)}
.qcard.ng{border-color:var(--ng);background:var(--ng-bg)}
.qdir{font-size:12px;color:var(--muted);margin-bottom:8px}
.prompt{font-weight:700;line-height:1.25;word-break:break-word}
.prompt.en{font-size:clamp(32px,9vw,46px);letter-spacing:-.01em}
.prompt.ja{font-size:clamp(22px,6vw,30px)}
.pos{margin-top:10px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.pos:empty{display:none}
.speak{position:absolute;top:8px;right:8px;border:0;background:transparent;font-size:20px;cursor:pointer;padding:6px;opacity:.75}
.timer{position:absolute;left:0;right:0;bottom:0;height:4px}
.timer>div{height:100%;background:var(--accent);transform-origin:left;transform:scaleX(1)}
.timer>div.low{background:var(--ng)}
.choices{display:grid;gap:10px}
@media(min-width:560px){.choices{grid-template-columns:1fr 1fr}}
.choice{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:60px;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-size:17px;cursor:pointer;touch-action:manipulation;transition:transform .06s,background .12s,border-color .12s,opacity .12s}
.choice:active{transform:scale(.98)}
@media(hover:hover){.choice:not(:disabled):hover{border-color:var(--accent)}}
.choice:disabled{cursor:default;color:var(--text)}
.num{flex:none;width:26px;height:26px;border-radius:8px;background:var(--accent-2);color:var(--accent);display:grid;place-items:center;font-size:13px;font-weight:700}
.choice.ok{border-color:var(--ok);background:var(--ok-bg)}
.choice.ok .num{background:var(--ok);color:#fff}
.choice.ng{border-color:var(--ng);background:var(--ng-bg)}
.choice.ng .num{background:var(--ng);color:#fff}
.choice.dim{opacity:.4}
.tap-next{text-align:center;color:var(--muted);font-size:13px;margin-top:14px}
/* result */
.big-score{font-size:44px;font-weight:800;text-align:center;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.list{list-style:none;padding:0;margin:0}
.list li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.list li:last-child{border:0}
.list span{color:var(--muted);text-align:right}
.actions{display:grid;gap:8px}
textarea{width:100%;min-height:45vh;font:14px/1.6 ui-monospace,Menlo,monospace;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);resize:vertical}
.edit-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
</style>
</head>
<body>
<div class="wrap">

<section id="home">
  <header class="hero">
    <h1>Word <span>Sprint</span></h1>
    <p class="muted">4択で英単語を高速周回。苦手な単語ほどよく出ます。</p>
  </header>
  <div class="sec-title">デッキを選ぶ</div>
  <div class="decks" id="decks"></div>
  <div class="card">
    <div class="row"><label>出題</label>
      <div class="seg" data-key="dir"><button data-val="e2j">英→日</button><button data-val="j2e">日→英</button><button data-val="mix">ミックス</button></div></div>
    <div class="row"><label>問題数</label>
      <div class="seg" data-key="count"><button data-val="10">10</button><button data-val="20">20</button><button data-val="50">50</button><button data-val="0">全部</button></div></div>
    <div class="row"><label>制限時間</label>
      <div class="seg" data-key="limit"><button data-val="0">なし</button><button data-val="5">5秒</button><button data-val="3">3秒</button></div></div>
    <div class="row"><label>自動発音</label>
      <div class="seg" data-key="speak"><button data-val="false">オフ</button><button data-val="true">オン</button></div></div>
    <button id="startBtn" class="btn primary big">スタート</button>
    <p class="hint">キーボード：1〜4で回答 ／ Enterで次へ ／ Escで中断</p>
  </div>
  <div class="card" id="homeStats"></div>
  <div class="links">
    <button class="btn ghost" id="resetBtn">学習記録をリセット</button>
  </div>
</section>

<section id="quiz" hidden>
  <div class="qtop">
    <button class="icon" id="quitBtn" aria-label="中断">✕</button>
    <div class="progress"><div id="prog"></div></div>
    <span id="counter"></span>
  </div>
  <div class="meta"><span id="streak"></span><span id="score"></span></div>
  <div class="card qcard" id="qcard">
    <button class="speak" id="speakBtn" aria-label="発音">🔊</button>
    <div class="qdir" id="qdir"></div>
    <div class="prompt" id="prompt"></div>
    <div class="pos" id="pos"></div>
    <div class="timer" id="timer"><div id="timerBar"></div></div>
  </div>
  <div class="choices" id="choices"></div>
  <p class="tap-next" id="tapNext" hidden>タップ / Enter で次へ</p>
</section>

<section id="result" hidden>
  <div class="card">
    <div class="big-score" id="rScore"></div>
    <div class="tiles">
      <div><b id="rAcc"></b><small>正答率</small></div>
      <div><b id="rAvg"></b><small>平均 / 問</small></div>
      <div><b id="rBest"></b><small>最高連続</small></div>
    </div>
  </div>
  <div class="card" id="missedCard">
    <h2>間違えた単語</h2>
    <ul class="list" id="missedList"></ul>
  </div>
  <div class="actions">
    <button class="btn primary big" id="retryMissed" style="margin-top:0">間違えた単語だけもう一度</button>
    <button class="btn" id="againBtn">同じ設定でもう一度</button>
    <button class="btn ghost" id="homeBtn">ホームへ</button>
  </div>
</section>

<section id="editor" hidden>
  <div class="card">
    <h2 id="editTitle">新しいデッキ</h2>
    <input type="text" id="deckName" placeholder="デッキ名（例：英検2級 単語帳）" maxlength="40">
    <p class="muted" style="font-size:14px;margin:6px 0 4px">1行に1語、「英単語,意味」の形式で入力します。タブ区切りや「|」区切りも使えるので、Excel・スプレッドシートの2列をそのまま貼り付けられます。4語以上必要です。</p>
    <div class="edit-bar">
      <label class="btn">ファイル読込<input type="file" id="fileIn" accept=".csv,.tsv,.txt" hidden></label>
      <button class="btn ghost" id="sampleBtn">例を挿入</button>
      <button class="btn ghost" id="exportDeck">CSV書き出し</button>
      <span class="muted" id="editCount" style="margin-left:auto;font-size:13px"></span>
    </div>
    <textarea id="customText" spellcheck="false" placeholder="apple,りんご&#10;borrow,借りる&#10;curious,好奇心の強い&#10;deliberate,意図的な"></textarea>
    <div class="actions" style="margin-top:12px">
      <button class="btn primary" id="saveCustom">保存</button>
      <button class="btn ghost" id="cancelEdit">キャンセル</button>
      <button class="btn ghost" id="deleteDeck" style="color:var(--ng)">このデッキを削除</button>
    </div>
  </div>
</section>

</div>

const POS = {n:'名詞', v:'動詞', adj:'形容詞', adv:'副詞'};
const parseRaw = raw => raw.trim().split('\n').map(l => { const [w,p,m] = l.split('|'); return {w, p, m}; });
// 内蔵デッキ。ここに {id, name, desc, raw} を足せばデッキが増える
const BUILTIN_DECKS = [
  {id:'basic',    name:'中学基礎',       desc:'日常の基本語から',      raw:RAW_BASIC},
  {id:'toeic',    name:'TOEIC頻出',      desc:'ビジネスの重要語',      raw:RAW_TOEIC},
  {id:'advanced', name:'上級',           desc:'英検準1級〜1級レベル',  raw:RAW_ADVANCED},
  {id:'it',       name:'IT・エンジニア', desc:'開発・運用の現場で使う語', raw:RAW_IT},
].map(d => ({id:d.id, name:d.name, desc:d.desc, builtin:true, words:parseRaw(d.raw)}));
const $ = s => document.querySelector(s);

const PREFIX = 'wordsprint.v1.';
const store = {
  get(k, d) { try { const v = localStorage.getItem(PREFIX + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(PREFIX + k, JSON.stringify(v)); } catch (e) {} }
};
const settings = Object.assign({deck:'toeic', dir:'e2j', count:20, limit:0, speak:false}, store.get('settings', {}));
let stats = store.get('stats', {});
let customDecks = store.get('decks', null);
if (!customDecks) { // 旧バージョンの「マイ単語」を移行
  const old = store.get('custom', []);
  customDecks = old.length ? [{id:'c1', name:'マイ単語', words:old}] : [];
  store.set('decks', customDecks);
}
const saveDecks = () => store.set('decks', customDecks);
const allDecks = () => [...BUILTIN_DECKS, ...customDecks];
if (settings.deck === 'builtin') settings.deck = 'toeic';
if (settings.deck === 'custom') settings.deck = customDecks[0] ? customDecks[0].id : 'toeic';
const canSpeak = 'speechSynthesis' in window;

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sKey = it => it.w + '\u0001' + it.m;
const curDeck = () => { const d = allDecks().find(x => x.id === settings.deck); return d && d.words.length >= 4 ? d : BUILTIN_DECKS[1]; };
const deck = () => curDeck().words;
function weight(it) { const s = stats[sKey(it)]; return s ? 0.3 + 4 * (s.w + 1) / (s.c + s.w + 2) : 2.3; }
function sample(list, n) {
  const pool = list.map(it => ({it, wt: weight(it)}));
  const out = []; n = Math.min(n || pool.length, pool.length);
  while (out.length < n) {
    let tot = 0; for (const p of pool) tot += p.wt;
    let r = Math.random() * tot, i = 0;
    for (; i < pool.length - 1; i++) { r -= pool[i].wt; if (r <= 0) break; }
    out.push(pool.splice(i, 1)[0].it);
  }
  return out;
}
function speak(t) {
  if (!canSpeak) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; speechSynthesis.speak(u); } catch (e) {}
}
function show(id) { for (const s of ['home','quiz','result','editor']) $('#' + s).hidden = s !== id; window.scrollTo(0, 0); }

/* ---------- home ---------- */
function deckStats(words) {
  let seen = 0, master = 0, c = 0, w = 0; const weak = [];
  for (const it of words) {
    const s = stats[sKey(it)]; if (!s) continue;
    seen++; c += s.c; w += s.w;
    if (s.c >= 3 && s.c >= s.w * 3) master++;
    if (s.w > 0) weak.push(it);
  }
  weak.sort((a, b) => weight(b) - weight(a));
  return {seen, master, c, w, weak};
}
function renderDecks(cur) {
  const box = $('#decks'); box.innerHTML = '';
  for (const d of allDecks()) {
    const st = deckStats(d.words), usable = d.words.length >= 4;
    const el = document.createElement('div');
    el.className = 'deck' + (d.id === cur.id ? ' on' : '') + (usable ? '' : ' off');
    el.tabIndex = 0; el.setAttribute('role', 'button');
    el.innerHTML = '<div class="dn"></div><div class="dd"></div><div class="dm"></div><div class="bar"><i></i></div>';
    el.querySelector('.dn').textContent = d.name;
    el.querySelector('.dd').textContent = d.builtin ? d.desc : (usable ? 'マイデッキ' : '4語以上で使えます');
    el.querySelector('.dm').textContent = `${d.words.length}語 · 定着 ${st.master}`;
    el.querySelector('.bar>i').style.width = (d.words.length ? st.master / d.words.length * 100 : 0) + '%';
    if (!d.builtin) {
      const e = document.createElement('button'); e.className = 'edit'; e.textContent = '✎'; e.setAttribute('aria-label', '編集');
      e.onclick = ev => { ev.stopPropagation(); openEditor(d.id); };
      el.appendChild(e);
    }
    const pick = () => { if (!usable) { openEditor(d.id); return; } settings.deck = d.id; store.set('settings', settings); renderHome(); };
    el.onclick = pick;
    el.onkeydown = ev => { if (ev.target === el && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); pick(); } };
    box.appendChild(el);
  }
  const nw = document.createElement('button'); nw.className = 'deck new'; nw.textContent = '＋ 新しいデッキ';
  nw.onclick = () => openEditor(null);
  box.appendChild(nw);
}
function renderHome() {
  document.querySelectorAll('.seg').forEach(seg => {
    const key = seg.dataset.key;
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', String(settings[key]) === b.dataset.val));
  });
  const cur = curDeck(); renderDecks(cur);
  $('#startBtn').textContent = `「${cur.name}」でスタート`;
  const {seen, master, c, w, weak} = deckStats(cur.words);
  const acc = c + w ? Math.round(c / (c + w) * 100) + '%' : '—';
  $('#homeStats').innerHTML =
    `<div class="sec-title" style="margin:0 0 10px"></div><div class="tiles"><div><b>${seen}<small>/${cur.words.length}</small></b><small>出題済み</small></div><div><b>${master}</b><small>定着</small></div><div><b>${acc}</b><small>累計正答率</small></div></div>` +
    (weak.length ? `<button class="btn big" id="weakBtn">苦手な単語を集中練習（${Math.min(weak.length, 20)}語）</button>` : '');
  $('#homeStats .sec-title').textContent = `${cur.name} の学習状況`;
  const wb = $('#weakBtn'); if (wb) wb.onclick = () => start(shuffle(weak.slice(0, 20)));
}
document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const key = seg.dataset.key, v = b.dataset.val;
  settings[key] = (key === 'count' || key === 'limit') ? Number(v) : key === 'speak' ? v === 'true' : v;
  store.set('settings', settings); renderHome();
}));
const startNew = () => start(sample(deck(), settings.count));
$('#startBtn').onclick = startNew;
$('#resetBtn').onclick = () => { if (confirm('学習記録（正誤履歴）をすべて消去しますか？')) { stats = {}; store.set('stats', stats); renderHome(); } };

/* ---------- quiz ---------- */
let Q = null;
function makeQ(it, d) {
  const dir = settings.dir === 'mix' ? (Math.random() < .5 ? 'e2j' : 'j2e') : settings.dir;
  const others = d.filter(x => x.m !== it.m && x.w !== it.w);
  let pool = it.p ? others.filter(x => x.p === it.p) : [];
  if (pool.length < 3) pool = others;
  const label = x => dir === 'e2j' ? x.m : x.w;
  const seen = new Set([label(it)]), picks = [];
  for (const x of shuffle(pool.slice())) { if (seen.has(label(x))) continue; seen.add(label(x)); picks.push(x); if (picks.length === 3) break; }
  const opts = shuffle([it, ...picks]);
  return {it, dir, opts, ans: opts.indexOf(it), label};
}
function start(items) {
  if (!items.length) return;
  Q = {items, i:0, ok:0, missed:[], times:[], streak:0, best:0, locked:false, raf:0, to:0};
  show('quiz'); render();
}
function render() {
  const it = Q.items[Q.i]; const q = Q.q = makeQ(it, deck());
  Q.locked = false;
  $('#counter').textContent = `${Q.i + 1} / ${Q.items.length}`;
  $('#prog').style.width = (Q.i / Q.items.length * 100) + '%';
  $('#qdir').textContent = q.dir === 'e2j' ? '意味は？' : '英語では？';
  const p = $('#prompt'); p.textContent = q.dir === 'e2j' ? it.w : it.m; p.className = 'prompt ' + (q.dir === 'e2j' ? 'en' : 'ja');
  $('#pos').textContent = it.p ? (POS[it.p] || it.p) : '';
  const box = $('#choices'); box.innerHTML = '';
  q.opts.forEach((o, i) => {
    const b = document.createElement('button'); b.className = 'choice';
    b.innerHTML = `<span class="num">${i + 1}</span><span></span>`;
    b.lastChild.textContent = q.label(o);
    b.addEventListener('click', () => answer(i));
    box.appendChild(b);
  });
  $('#tapNext').hidden = true;
  $('#qcard').classList.remove('ok', 'ng');
  $('#streak').textContent = Q.streak >= 3 ? `🔥 ${Q.streak}連続` : '';
  $('#score').textContent = `正解 ${Q.ok}`;
  $('#speakBtn').hidden = !canSpeak || q.dir !== 'e2j';
  if (document.activeElement) document.activeElement.blur();
  if (settings.speak && q.dir === 'e2j') speak(it.w);
  Q.qt0 = performance.now();
  startTimer();
}
function startTimer() {
  cancelAnimationFrame(Q.raf);
  const lim = settings.limit * 1000, bar = $('#timerBar');
  $('#timer').hidden = !lim; if (!lim) return;
  const tick = () => {
    if (!Q || Q.locked) return;
    const r = 1 - (performance.now() - Q.qt0) / lim;
    bar.style.transform = `scaleX(${Math.max(0, r)})`;
    bar.classList.toggle('low', r < .3);
    if (r <= 0) { answer(-1); return; }
    Q.raf = requestAnimationFrame(tick);
  };
  tick();
}
function answer(i) {
  if (!Q || Q.locked) return;
  Q.locked = true; Q.lockedAt = performance.now(); cancelAnimationFrame(Q.raf);
  const {it, ans, dir} = Q.q, ok = i === ans;
  Q.times.push(performance.now() - Q.qt0);
  [...$('#choices').children].forEach((b, j) => {
    b.disabled = true;
    b.classList.add(j === ans ? 'ok' : j === i ? 'ng' : 'dim');
  });
  const k = sKey(it), s = stats[k] || (stats[k] = {c:0, w:0});
  if (ok) { s.c++; Q.ok++; Q.streak++; Q.best = Math.max(Q.best, Q.streak); }
  else { s.w++; Q.streak = 0; if (!Q.missed.includes(it)) Q.missed.push(it); }
  s.t = Date.now(); store.set('stats', stats);
  $('#qcard').classList.add(ok ? 'ok' : 'ng');
  $('#score').textContent = `正解 ${Q.ok}`;
  if (settings.speak && dir === 'j2e') speak(it.w);
  if (ok) Q.to = setTimeout(next, 380);
  else { $('#tapNext').hidden = false; Q.to = setTimeout(next, 1800); }
}
function next() {
  if (!Q) return;
  clearTimeout(Q.to); Q.i++;
  if (Q.i >= Q.items.length) finish(); else render();
}
function quit() {
  if (!Q) return;
  clearTimeout(Q.to); cancelAnimationFrame(Q.raf);
  const done = Q.times.length;
  if (!done) { Q = null; renderHome(); show('home'); return; }
  Q.items = Q.items.slice(0, done); finish();
}
function finish() {
  cancelAnimationFrame(Q.raf); clearTimeout(Q.to);
  const n = Q.items.length;
  const avg = Q.times.reduce((a, b) => a + b, 0) / Q.times.length / 1000;
  $('#rScore').textContent = `${Q.ok} / ${n}`;
  $('#rAcc').textContent = Math.round(Q.ok / n * 100) + '%';
  $('#rAvg').textContent = avg.toFixed(1) + '秒';
  $('#rBest').textContent = Q.best;
  const ul = $('#missedList'); ul.innerHTML = '';
  for (const it of Q.missed) {
    const li = document.createElement('li');
    li.innerHTML = '<b></b><span></span>';
    li.firstChild.textContent = it.w; li.lastChild.textContent = it.m;
    if (canSpeak) { li.style.cursor = 'pointer'; li.onclick = () => speak(it.w); }
    ul.appendChild(li);
  }
  $('#missedCard').hidden = !Q.missed.length;
  $('#retryMissed').hidden = !Q.missed.length;
  show('result');
}
$('#quiz').addEventListener('click', e => {
  if (e.target.closest('#quitBtn, #speakBtn')) return;
  if (Q && Q.locked && performance.now() - Q.lockedAt > 250) next();
});
// 別アプリ・別タブにいた間は回答時間に数えない（戻った瞬間に時間切れにしない）
document.addEventListener('visibilitychange', () => {
  if (!Q) return;
  if (document.hidden) { Q.hiddenAt = performance.now(); cancelAnimationFrame(Q.raf); return; }
  if (!Q.hiddenAt) return;
  const away = performance.now() - Math.max(Q.hiddenAt, Q.qt0); Q.hiddenAt = 0;
  if (!Q.locked && away > 0) { Q.qt0 += away; startTimer(); }
});
$('#quitBtn').onclick = quit;
$('#speakBtn').onclick = () => Q && speak(Q.q.it.w);
$('#retryMissed').onclick = () => { if (Q) start(shuffle(Q.missed.slice())); };
$('#againBtn').onclick = startNew;
$('#homeBtn').onclick = () => { renderHome(); show('home'); };

/* ---------- editor ---------- */
const unquote = s => /^"[\s\S]*"$/.test(s) ? s.slice(1, -1).replace(/""/g, '"') : s;
// 1 行を [単語, 意味] に分ける。タブがあればタブで、無ければ最初の , か | で区切る。
// 先頭が " の CSV フィールドは閉じ " まで読み、"" を " に戻す（書き出しとの往復を保つ）
function splitPair(line) {
  let w, rest;
  if (line[0] === '"') {
    let i = 1, s = '';
    for (; i < line.length; i++) {
      if (line[i] !== '"') s += line[i];
      else if (line[i + 1] === '"') { s += '"'; i++; }
      else break;
    }
    const m = line.slice(i + 1).match(/^\s*[\t,|]\s*(.*)$/);
    if (i >= line.length || !m) return null;
    w = s; rest = m[1];
  } else {
    const m = line.match(line.includes('\t') ? /^(.+?)\s*\t\s*(.+)$/ : /^(.+?)\s*[,|]\s*(.+)$/);
    if (!m) return null;
    w = m[1]; rest = m[2];
  }
  return [w.trim(), unquote(rest.trim()).trim()];
}
const csvField = s => /[",|\t\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
const toLine = x => csvField(x.w) + ',' + csvField(x.m);
const isHeader =(w, m) => /^(word|english|en|term|英単語|単語|英語)$/i.test(w) && /^(meaning|japanese|ja|definition|意味|日本語|訳)$/i.test(m);
function parseList(text) {
  const out = [], seen = new Set();
  for (let line of text.split(/\r?\n/)) {
    line = line.trim();
    if (!line || line.startsWith('#')) continue;
    const pair = splitPair(line);
    if (!pair) continue;
    const [w, mean] = pair;
    if (!w || !mean || isHeader(w, mean)) continue;
    const k = w + '\u0001' + mean; if (seen.has(k)) continue; seen.add(k);
    out.push({w, p:'', m: mean});
  }
  return out;
}
const updCount = () => { $('#editCount').textContent = parseList($('#customText').value).length + ' 語'; };
$('#customText').addEventListener('input', updCount);
let editingId = null;
function openEditor(id) {

  $('#editTitle').textContent = d ? 'デッキを編集' : '新しいデッキ';

  $('#deleteDeck').hidden = !d; $('#exportDeck').hidden = !d;
  updCount(); show('editor');
}
$('#cancelEdit').onclick = () => show('home');
$('#deleteDeck').onclick = () => {

  renderHome(); show('home');
};

  a.download = (d.name || 'deck') + '.csv'; a.click();

};
$('#sampleBtn').onclick = () => {
  const t = $('#customText'); const ex = 'apple,りんご\nborrow,借りる\ncurious,好奇心の強い\ndeliberate,意図的な\nelegant,優雅な';
  t.value = (t.value.trim() ? t.value.trim() + '\n' : '') + ex; updCount();
};
$('#fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { const t = $('#customText'); if (!$('#deckName').value.trim()) $('#deckName').value = f.name.replace(/\.[^.]+$/, ''); t.value = (t.value.trim() ? t.value.trim() + '\n' : '') + String(r.result).replace(/^\uFEFF/, ''); updCount(); };
  r.readAsText(f); e.target.value = '';
});
// 記録のキーは「単語＋意味」なので、意味だけ直すと記録が外れる。
// 単語が一意に対応するときだけ、旧キーの記録を新キーへ引き継ぐ
function carryStats(deckId, oldWords, newWords) {
  const newKeys = new Set(newWords.map(sKey)), count = (list, w) => list.filter(x => x.w === w).length;
  const usedElsewhere = new Set(allDecks().filter(x => x.id !== deckId).flatMap(x => x.words.map(sKey)));
  for (const it of newWords) {
    const k = sKey(it);
    if (stats[k] || count(newWords, it.w) !== 1 || count(oldWords, it.w) !== 1) continue;
    const from = sKey(oldWords.find(x => x.w === it.w));
    if (newKeys.has(from) || !stats[from]) continue;
    stats[k] = {...stats[from]};
    if (!usedElsewhere.has(from)) delete stats[from]; // 他デッキと共有している記録は残す
  }
  store.set('stats', stats);
}
$('#saveCustom').onclick = () => {
  const list = parseList($('#customText').value);
  if (list.length < 4) { alert('4語以上登録してください（現在 ' + list.length + ' 語）'); return; }
  const name = $('#deckName').value.trim() || 'マイデッキ';
  const d = customDecks.find(x => x.id === editingId);
  if (d) { carryStats(d.id, d.words, list); d.name = name; d.words = list; }
  else { editingId = 'c' + Date.now().toString(36); customDecks.push({id:editingId, name, words:list}); }
  saveDecks();
  settings.deck = editingId; store.set('settings', settings);
  renderHome(); show('home');
};

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target.closest && e.target.closest('.deck')) return;
  if (!$('#quiz').hidden) {
    if (/^[1-4]$/.test(e.key)) { answer(+e.key - 1); e.preventDefault(); }
    else if (e.key === 'Enter' || e.key === ' ') { if (Q && Q.locked) next(); e.preventDefault(); }
    else if (e.key === 'Escape') quit();
  } else if (e.key === 'Enter' && e.target.closest && e.target.closest('button, a')) {
    // フォーカス中のボタンの Enter はそのボタンに任せる（奪ってスタートしない）
  } else if (!$('#home').hidden && e.key === 'Enter') { startNew(); e.preventDefault(); }
  else if (!$('#result').hidden && e.key === 'Enter') { startNew(); e.preventDefault(); }
});

renderHome();
})();
</script>
</body>
</html>
